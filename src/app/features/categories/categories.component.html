<main class="mx-auto flex h-full max-w-7xl flex-col gap-3 px-6 py-3">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Categories</h1>
    </div>

    <a
      *ngIf="isAdmin"
      routerLink="/categories/add"
      class="inline-flex items-center justify-center rounded-xl bg-emerald-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
    >
      + Add Category
    </a>
  </div>

  <div class="grid gap-3 md:grid-cols-3">
    <div class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
      <p class="text-xs uppercase tracking-wide text-slate-500">Total Categories</p>
      <p class="mt-2 text-2xl font-semibold text-slate-900">{{ categories.length }}</p>
    </div>
  </div>

  <section class="mt-1 flex min-h-0 flex-1">
    <app-categories-list
      class="block h-full w-full"
      [categories]="categories"
    ></app-categories-list>
  </section>
</main>
