<main class="mx-auto flex max-w-7xl flex-col gap-3 px-6 py-3">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h1 class="mt-2 text-3xl font-semibold text-slate-900">
        {{ isEditMode ? 'Edit Category' : 'Add Category' }}
      </h1>
    </div>

    <button
      type="button"
      (click)="cancel()"
      class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
    >
      Back to list
    </button>
  </div>

  <section class="max-h-[70vh] overflow-y-auto rounded-2xl border border-slate-200 bg-white p-6 shadow-sm pr-1">
    <p *ngIf="errorMessage" class="mb-4 rounded-md bg-rose-50 p-3 text-sm text-rose-600" role="alert">
      {{ errorMessage }}
    </p>
    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="grid gap-5 md:grid-cols-2">
      <div class="md:col-span-2">
        <label for="category-name" class="mb-2 block text-sm font-medium text-slate-700">Category Name</label>
        <input
          id="category-name"
          type="text"
          formControlName="name"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          [class.border-red-500]="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid"
        />
        <p *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid" class="mt-1 text-xs text-red-600">
          Category name is required.
        </p>
      </div>

      <div class="md:col-span-2">
        <label for="category-description" class="mb-2 block text-sm font-medium text-slate-700">Description</label>
        <textarea
          id="category-description"
          rows="4"
          formControlName="description"
          class="w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-2.5 text-slate-800 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          [class.border-red-500]="categoryForm.get('description')?.touched && categoryForm.get('description')?.invalid"
        ></textarea>
        <p *ngIf="categoryForm.get('description')?.touched && categoryForm.get('description')?.invalid" class="mt-1 text-xs text-red-600">
          Description must be at least 10 characters.
        </p>
      </div>

     
      <div class="md:col-span-2 flex flex-col gap-3 pt-2 sm:flex-row sm:justify-end">
        <button type="button" (click)="cancel()" class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
          Cancel
        </button>
        <button type="submit" [disabled]="isLoading" class="rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">
          {{ isLoading ? 'Saving...' : (isEditMode ? 'Update Category' : 'Save Category') }}
        </button>
      </div>
    </form>
  </section>
</main>
