<main class="mx-auto flex h-full max-w-7xl flex-col gap-2.5 sm:gap-3 px-2 sm:px-6 py-2.5 sm:py-3">
  <div class="flex items-center justify-between gap-2">
    <div>
      <h1 class="text-lg sm:text-2xl font-semibold text-slate-900">Products</h1>
    </div>

    <a
      *ngIf="canCreateType()"
      routerLink="/products/add"
      class="inline-flex shrink-0 items-center justify-center rounded-lg sm:rounded-xl bg-blue-600 px-2 py-1 sm:px-3 sm:py-2 text-xs sm:text-sm font-semibold text-white shadow-sm transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      + Add Product
    </a>
  </div>

  <!-- Summary Cards: 1 line on mobile & tablet, compact size to never hide table -->
  <div class="grid grid-cols-3 gap-2 sm:gap-3">
    <div class="rounded-xl border border-slate-200 bg-white px-2 py-1.5 sm:px-3 sm:py-2.5 shadow-sm">
      <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Total Products</p>
      <p class="mt-0.5 sm:mt-1 text-base sm:text-2xl font-bold text-slate-900 leading-tight">{{ total }}</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white px-2 py-1.5 sm:px-3 sm:py-2.5 shadow-sm">
      <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Low Stock</p>
      <p class="mt-0.5 sm:mt-1 text-base sm:text-2xl font-bold text-amber-600 leading-tight">{{ countByStatus('Low Stock') }}</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white px-2 py-1.5 sm:px-3 sm:py-2.5 shadow-sm">
      <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Out of Stock</p>
      <p class="mt-0.5 sm:mt-1 text-base sm:text-2xl font-bold text-red-600 leading-tight">{{ countByStatus('Out of Stock') }}</p>
    </div>
  </div>

  <section class="mt-1 flex min-h-0 flex-1">
    <app-products-list
      class="block h-full w-full"
      [products]="products"
      [allProducts]="allProducts"
      [myTasks]="myTasks"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [total]="total"
      [totalPages]="totalPages"
      (pageChange)="goToPage($event)"
    ></app-products-list>
  </section>
</main>
