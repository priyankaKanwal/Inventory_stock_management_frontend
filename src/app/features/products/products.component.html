<main class="mx-auto flex h-full max-w-7xl flex-col gap-3 px-6 py-3">
  <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Products</h1>
    </div>

    <a
      *ngIf="isAdmin"
      routerLink="/products/add"
      class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-3 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      + Add Product
    </a>
  </div>

  <div class="grid gap-3 md:grid-cols-3">
    <div class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
      <p class="text-xs uppercase tracking-wide text-slate-500">Total Products</p>
      <p class="mt-2 text-2xl font-semibold text-slate-900">{{ products.length }}</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
      <p class="text-xs uppercase tracking-wide text-slate-500">Low Stock</p>
      <p class="mt-2 text-2xl font-semibold text-amber-600">{{ countByStatus('Low Stock') }}</p>
    </div>
    <div class="rounded-xl border border-slate-200 bg-white p-3 shadow-sm">
      <p class="text-xs uppercase tracking-wide text-slate-500">Out of Stock</p>
      <p class="mt-2 text-2xl font-semibold text-red-600">{{ countByStatus('Out of Stock') }}</p>
    </div>
  </div>

  <section class="mt-1 flex min-h-0 flex-1">
    <app-products-list
      class="block h-full w-full"
      [products]="products"
    ></app-products-list>
  </section>
</main>
