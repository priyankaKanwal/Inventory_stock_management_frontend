<main class="mx-auto flex h-full max-w-7xl flex-col gap-2.5 sm:gap-3 px-2 sm:px-6 py-2.5 sm:py-3">
  <div class="flex items-center justify-between gap-2">
    <div>
      <h1 class="text-lg sm:text-2xl font-semibold text-slate-900">Suppliers</h1>
    </div>

    <a
      *ngIf="canCreateType()"
      routerLink="/suppliers/add"
      class="inline-flex shrink-0 items-center justify-center rounded-lg sm:rounded-xl bg-violet-600 px-2 py-1 sm:px-3 sm:py-2 text-xs sm:text-sm font-semibold text-white shadow-sm transition hover:bg-violet-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2"
    >
      + Add Supplier
    </a>
  </div>

  <div class="flex">
    <div class="rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 sm:px-3 sm:py-2.5 shadow-sm min-w-[130px] sm:min-w-[170px]">
      <p class="text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-slate-500 truncate">Total Suppliers</p>
      <p class="mt-0.5 sm:mt-1 text-base sm:text-2xl font-bold text-slate-900 leading-tight">{{ total }}</p>
    </div>
  </div>

    <section class="mt-1 flex min-h-0 flex-1">
    <app-suppliers-list
      class="block h-full w-full"
      [suppliers]="suppliers"
      [allSuppliers]="allSuppliers"
      [myTasks]="myTasks"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [total]="total"
      [totalPages]="totalPages"
      (pageChange)="goToPage($event)"
    ></app-suppliers-list>
  </section>

</main>
