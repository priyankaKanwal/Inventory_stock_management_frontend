<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 p-4 backdrop-blur-sm"
  (click)="onBackdropClick($event)"
>
  <div
    class="flex max-h-[90vh] w-full flex-col overflow-hidden rounded-2xl bg-white shadow-xl"
    [style.maxWidth]="maxWidth"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
  >
    <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
      <h2 class="text-lg font-semibold text-slate-900">{{ title }}</h2>
      <button
        type="button"
        (click)="close()"
        class="rounded-lg p-1 text-slate-400 transition-colors duration-150 hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-400"
        aria-label="Close dialog"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto px-6 py-5">
      <ng-content select="[body]"></ng-content>
    </div>

    <div *ngIf="showFooter" class="flex items-center justify-end gap-3 border-t border-slate-200 px-6 py-4">
      <ng-content select="[footer]"></ng-content>
    </div>
  </div>
</div>
