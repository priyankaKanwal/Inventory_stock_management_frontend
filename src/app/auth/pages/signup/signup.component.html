<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-sm ring-1 ring-slate-200">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-semibold text-slate-900">Create account</h1>
      <p class="mt-1 text-sm text-slate-500">Get started with inventory management</p>
    </div>

    <p *ngIf="errorMessage" class="mb-4 rounded-md bg-rose-50 p-3 text-sm text-rose-600" role="alert">
      {{ errorMessage }}
    </p>

    <p *ngIf="successMessage" class="mb-4 rounded-md bg-green-50 p-3 text-sm text-green-600" role="alert">
      {{ successMessage }}
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-slate-700">Username</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" autocomplete="username"
          class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
          placeholder="johndoe" />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" autocomplete="email"
          class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
          placeholder="you@staff.com" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" autocomplete="new-password"
          class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
          placeholder="Create a password" />
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm Password</label>
        <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword"
          autocomplete="new-password"
          class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500"
          placeholder="Confirm your password" />
      </div>

      <div>
        <label for="role" class="block text-sm font-medium text-slate-700">Role</label>
        <select id="role" [(ngModel)]="role" name="role"
          class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-1 focus:ring-sky-500">
          <option value="ADMIN">ADMIN</option>
          <option value="STAFF">STAFF</option>
        </select>
      </div>

      <button type="submit"
        class="w-full rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2">
        Create account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Already have an account?
      <a routerLink="/login" class="font-medium text-sky-600 hover:text-sky-500">Sign in</a>
    </p>
  </div>
</div>
