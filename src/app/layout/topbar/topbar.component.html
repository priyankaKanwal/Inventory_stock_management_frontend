<header class="flex min-h-16 flex-wrap items-center justify-between gap-4 border-b border-slate-200/80 bg-white/80 px-4 py-3 shadow-sm backdrop-blur-sm sm:px-6 sm:min-h-20">
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-slate-700 shadow-sm transition-all duration-200 hover:bg-slate-100 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 md:hidden"
      aria-label="Toggle navigation"
      (click)="onToggleSidebar()"
    >
      <svg viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5" aria-hidden="true">
        <path d="M3 5h14v2H3V5zm0 6h14v2H3v-2zm0 6h14v2H3v-2z" />
      </svg>
    </button>

    <div class="min-w-0">
      <h1 class="mt-1 truncate text-base font-semibold text-slate-900 sm:text-lg">Welcome back, {{ userName }}</h1>
      <p class="mt-0.5 hidden text-sm text-slate-500 sm:block">Here's what's happening with your inventory today.</p>
    </div>
  </div>

  <div class="order-3 w-full md:order-2 md:w-auto md:min-w-72 lg:min-w-96">
    <label for="inventory-search" class="sr-only">Search inventory</label>
    <div class="relative">
      <span class="pointer-events-none absolute inset-y-0 left-3 z-10 flex items-center text-slate-400" aria-hidden="true">⌕</span>
      <input
        #searchInput
        id="inventory-search"
        type="search"
        placeholder="Search by product, supplier or category"
        value="{{ searchQuery }}"
        (input)="onSearchInput(searchInput.value)"
        (keydown)="onSearchKeydown($event)"
        (blur)="onBlurSuggestions()"
        class="w-full rounded-lg border border-slate-200 bg-slate-50 py-2.5 pl-9 pr-4 text-sm text-slate-900 outline-none transition-all duration-200 placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100 focus:shadow-sm"
      />

      <div
        *ngIf="showSuggestions && suggestions.length > 0"
        class="absolute left-0 right-0 top-full z-20 mt-2 overflow-hidden rounded-lg border border-slate-200 bg-white py-1 shadow-xl"
      >
        <button
          type="button"
          *ngFor="let suggestion of suggestions; let i = index"
          (mousedown)="selectSuggestion(suggestion)"
          [class]="i === selectedSuggestionIndex ? 'flex w-full items-center gap-3 px-3 py-2 text-left text-sm text-slate-900 bg-blue-50' : 'flex w-full items-center gap-3 px-3 py-2 text-left text-sm text-slate-700 hover:bg-slate-50 transition-colors duration-150'"
        >
          <span
            [class]="suggestion.type === 'product'
              ? 'inline-flex shrink-0 rounded bg-blue-100 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-blue-700'
              : suggestion.type === 'supplier'
                ? 'inline-flex shrink-0 rounded bg-violet-100 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-violet-700'
                : 'inline-flex shrink-0 rounded bg-emerald-100 px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-emerald-700'"
          >
            {{ suggestion.type }}
          </span>
          <span class="min-w-0 flex-1 truncate">{{ suggestion.name }}</span>
          <span class="ml-auto truncate text-xs text-slate-400">{{ suggestion.sub }}</span>
        </button>
      </div>
    </div>
  </div>

  <div class="order-2 flex items-center gap-3 md:order-3">
    <div class="flex items-center gap-2 border-l border-slate-200 pl-3">
      <a routerLink="/dashboard" aria-label="Open admin profile" class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-blue-500 to-blue-600 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:shadow-md hover:shadow-blue-500/25 hover:from-blue-600 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        {{ userName.charAt(0).toUpperCase() }}
      </a>
      <span class="hidden text-sm font-medium text-slate-700 sm:inline">{{ userName }}</span>
      <span
        [ngClass]="{
          'bg-violet-100 text-violet-700 ring-violet-200': currentRole === 'SUPER_ADMIN',
          'bg-amber-100 text-amber-700 ring-amber-200': currentRole === 'ADMIN_MANAGER' || currentRole === 'STAFF_MANAGER',
          'bg-emerald-100 text-emerald-700 ring-emerald-200': currentRole === 'ADMIN' || currentRole === 'STAFF'
        }"
        class="hidden rounded-full px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide ring-1 lg:inline"
      >
        {{ currentRole }}
      </span>
    </div>
  </div>
</header>
