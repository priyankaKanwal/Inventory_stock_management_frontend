<div class="relative flex h-full w-full min-h-0">
  <div *ngIf="isOpen" class="fixed inset-0 z-40 bg-slate-950/50 backdrop-blur-sm transition-opacity duration-300 md:hidden" (click)="closeSidebar()" aria-hidden="true">
  </div>

  <aside [class.-translate-x-full]="!isOpen" [class.translate-x-0]="isOpen"
    class="fixed inset-y-0 left-0 z-50 flex h-screen w-72 shrink-0 -translate-x-full flex-col bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 px-4 py-6 text-slate-300 transition-all duration-300 ease-in-out md:static md:inset-auto md:z-auto md:h-full md:w-64 md:translate-x-0 md:transform-none md:shadow-none">
    <div class="flex items-center justify-between border-b border-slate-800/60 px-3 pb-6">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-blue-400">Inventory</p>
        <h2 class="mt-2 text-lg font-semibold leading-6 text-white">Stock Management</h2>
      </div>
    </div>

    <nav class="mt-8 flex-1 overflow-y-auto" aria-label="Sidebar navigation">
      <p class="px-3 text-xs font-semibold uppercase tracking-wider text-slate-500">Workspace</p>

      <div class="mt-3 space-y-1">
        <a routerLink="/dashboard" routerLinkActive="bg-blue-600/90 text-white shadow-lg shadow-blue-500/20"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()"
          class="group flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:bg-slate-800/80 hover:text-white hover:shadow-md hover:shadow-slate-950/30 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="mr-3 w-5 text-center text-base transition-transform duration-200 group-hover:scale-110" aria-hidden="true">⌂</span>
          Dashboard
        </a>

        <a routerLink="/products" routerLinkActive="bg-blue-600/90 text-white shadow-lg shadow-blue-500/20"
          (click)="closeSidebar()"
          class="group flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:bg-slate-800/80 hover:text-white hover:shadow-md hover:shadow-slate-950/30 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="mr-3 w-5 text-center text-base transition-transform duration-200 group-hover:scale-110" aria-hidden="true">▦</span>
          Products
        </a>

        <a routerLink="/categories" routerLinkActive="bg-blue-600/90 text-white shadow-lg shadow-blue-500/20"
          (click)="closeSidebar()"
          class="group flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:bg-slate-800/80 hover:text-white hover:shadow-md hover:shadow-slate-950/30 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="mr-3 w-5 text-center text-base transition-transform duration-200 group-hover:scale-110" aria-hidden="true">◈</span>
          Categories
        </a>

        <a routerLink="/suppliers" routerLinkActive="bg-blue-600/90 text-white shadow-lg shadow-blue-500/20"
          (click)="closeSidebar()"
          class="group flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:bg-slate-800/80 hover:text-white hover:shadow-md hover:shadow-slate-950/30 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="mr-3 w-5 text-center text-base transition-transform duration-200 group-hover:scale-110" aria-hidden="true">♧</span>
          Suppliers
        </a>

        <a *ngIf="canViewMyTasks" routerLink="/tasks" routerLinkActive="bg-blue-600/90 text-white shadow-lg shadow-blue-500/20"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()"
          class="group flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:bg-slate-800/80 hover:text-white hover:shadow-md hover:shadow-slate-950/30 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="mr-3 w-5 text-center text-base transition-transform duration-200 group-hover:scale-110" aria-hidden="true">☑</span>
          Tasks
        </a>

        <a *ngIf="canManageTasks" routerLink="/tasks/manage" routerLinkActive="bg-blue-600/90 text-white shadow-lg shadow-blue-500/20"
          (click)="closeSidebar()"
          class="group flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:bg-slate-800/80 hover:text-white hover:shadow-md hover:shadow-slate-950/30 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="mr-3 w-5 text-center text-base transition-transform duration-200 group-hover:scale-110" aria-hidden="true">✎</span>
          Manage Tasks
        </a>

        <a *ngIf="canManageUsers" routerLink="/admin/users" routerLinkActive="bg-blue-600/90 text-white shadow-lg shadow-blue-500/20"
          (click)="closeSidebar()"
          class="group flex items-center rounded-lg px-3 py-2.5 text-sm font-medium transition-all duration-200 hover:bg-slate-800/80 hover:text-white hover:shadow-md hover:shadow-slate-950/30 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <span class="mr-3 w-5 text-center text-base transition-transform duration-200 group-hover:scale-110" aria-hidden="true">⚙</span>
          User Management
        </a>
      </div>

    </nav>

    <span class="mb-4 inline-flex w-fit items-center rounded-full px-3 py-1 text-xs font-semibold uppercase tracking-wide text-blue-300 ring-1 ring-blue-500/40">
      {{ roleBadge }}
    </span>

    <button type="button" (click)="logout()"
      class="flex w-full items-center rounded-lg px-3 py-2.5 text-sm font-medium text-slate-400 transition-all duration-200 hover:bg-red-500/10 hover:text-red-300 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-red-400">
      <span class="mr-3 w-5 text-center text-base" aria-hidden="true">↪</span>
      Sign out
    </button>
  </aside>
</div>
